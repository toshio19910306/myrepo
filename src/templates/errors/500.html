{% extends "base.html" %}

{% block title %}サーバーエラー - 作業実績バッチシステム{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl mb-4">⚠️</div>
        <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">500</h1>
        <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-300 mb-4">サーバーエラー</h2>
        <p class="text-gray-600 dark:text-gray-400 mb-8">
            申し訳ございません。サーバー内部でエラーが発生しました。<br>
            しばらく時間をおいてから再度お試しください。
        </p>
        <a href="{{ url_for('dashboard.dashboard') }}" 
           class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
            ダッシュボードに戻る
        </a>
    </div>
</div>
{% endblock %}
