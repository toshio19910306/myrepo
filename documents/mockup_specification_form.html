<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仕様登録 - 見積管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#82A0AA',
                        secondary: '#B31F26',
                        light: '#FFFFFF',
                        dark: '#000000'
                    }
                }
            },
            darkMode: 'class'
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div class="min-h-full">
        <nav class="bg-primary shadow-sm">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 justify-between">
                    <div class="flex">
                        <div class="flex flex-shrink-0 items-center">
                            <h1 class="text-xl font-bold text-white">見積管理システム</h1>
                        </div>
                        <div class="hidden sm:-my-px sm:ml-6 sm:flex sm:space-x-8">
                            <a href="#" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-white hover:text-gray-200 border-b-2 border-transparent">
                                <i class="fas fa-home mr-2"></i>ダッシュボード
                            </a>
                            <a href="#" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-white hover:text-gray-200 border-b-2 border-white">
                                <i class="fas fa-file-alt mr-2"></i>仕様登録
                            </a>
                            <a href="#" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-white hover:text-gray-200 border-b-2 border-transparent">
                                <i class="fas fa-paper-plane mr-2"></i>見積依頼
                            </a>
                            <a href="#" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-white hover:text-gray-200 border-b-2 border-transparent">
                                <i class="fas fa-reply mr-2"></i>見積回答
                            </a>
                            <a href="#" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-white hover:text-gray-200 border-b-2 border-transparent">
                                <i class="fas fa-tasks mr-2"></i>ワークフロー
                            </a>
                        </div>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:items-center">
                        <button id="theme-toggle" class="rounded-full bg-white p-1 text-primary hover:text-secondary focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary mr-4">
                            <i class="fas fa-moon dark:hidden"></i>
                            <i class="fas fa-sun hidden dark:block"></i>
                        </button>
                        <div class="relative ml-3">
                            <div class="flex items-center text-white">
                                <span class="text-sm mr-2">IT部門 管理者</span>
                                <a href="#" class="text-sm hover:text-gray-200">
                                    <i class="fas fa-sign-out-alt"></i> ログアウト
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="py-10">
            <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
                <div class="md:flex md:items-center md:justify-between">
                    <div class="min-w-0 flex-1">
                        <h2 class="text-2xl font-bold leading-7 text-gray-900 dark:text-white sm:truncate sm:text-3xl sm:tracking-tight">
                            新規仕様登録
                        </h2>
                    </div>
                    <div class="mt-4 flex md:ml-4 md:mt-0">
                        <a href="#" class="inline-flex items-center rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                            <i class="fas fa-arrow-left mr-2"></i>
                            一覧に戻る
                        </a>
                    </div>
                </div>

                <div class="mt-8">
                    <div class="overflow-hidden bg-white dark:bg-gray-800 shadow sm:rounded-lg">
                        <form>
                            <div class="px-4 py-5 sm:p-6">
                                <div class="grid grid-cols-1 gap-6">
                                    <div>
                                        <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                            仕様タイトル <span class="text-red-500">*</span>
                                        </label>
                                        <div class="mt-1">
                                            <input type="text" id="title" name="title" required
                                                   class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                   placeholder="例：新システム開発プロジェクト">
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                                            作業項目 <span class="text-red-500">*</span>
                                        </label>
                                        <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_1" name="work_items" type="checkbox" value="基本構想立案"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_1" class="font-medium text-gray-700 dark:text-gray-300">基本構想立案</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_2" name="work_items" type="checkbox" value="要件定義"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700" checked>
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_2" class="font-medium text-gray-700 dark:text-gray-300">要件定義</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_3" name="work_items" type="checkbox" value="AP外部設計"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700" checked>
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_3" class="font-medium text-gray-700 dark:text-gray-300">AP外部設計</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_4" name="work_items" type="checkbox" value="ＡＰ内部設計"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_4" class="font-medium text-gray-700 dark:text-gray-300">ＡＰ内部設計</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_5" name="work_items" type="checkbox" value="AP製造"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700" checked>
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_5" class="font-medium text-gray-700 dark:text-gray-300">AP製造</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_6" name="work_items" type="checkbox" value="プログラムテスト（単体テスト)"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_6" class="font-medium text-gray-700 dark:text-gray-300">プログラムテスト（単体テスト)</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_7" name="work_items" type="checkbox" value="AP結合テスト"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_7" class="font-medium text-gray-700 dark:text-gray-300">AP結合テスト</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_8" name="work_items" type="checkbox" value="システムテスト"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_8" class="font-medium text-gray-700 dark:text-gray-300">システムテスト</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_9" name="work_items" type="checkbox" value="システム受入支援・移行"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_9" class="font-medium text-gray-700 dark:text-gray-300">システム受入支援・移行</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="work_item_10" name="work_items" type="checkbox" value="運用保守"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="work_item_10" class="font-medium text-gray-700 dark:text-gray-300">運用保守</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                                            成果物 <span class="text-red-500">*</span>
                                        </label>
                                        <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3 max-h-48 overflow-y-auto border border-gray-200 dark:border-gray-600 rounded-md p-3">
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="deliverable_1" name="deliverables" type="checkbox" value="基本計画"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-secondary focus:ring-secondary dark:bg-gray-700">
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="deliverable_1" class="font-medium text-gray-700 dark:text-gray-300">基本計画</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="deliverable_2" name="deliverables" type="checkbox" value="業務要件定義書"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-secondary focus:ring-secondary dark:bg-gray-700" checked>
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="deliverable_2" class="font-medium text-gray-700 dark:text-gray-300">業務要件定義書</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="deliverable_3" name="deliverables" type="checkbox" value="システム要件定義書"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-secondary focus:ring-secondary dark:bg-gray-700" checked>
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="deliverable_3" class="font-medium text-gray-700 dark:text-gray-300">システム要件定義書</label>
                                                </div>
                                            </div>
                                            <div class="relative flex items-start">
                                                <div class="flex h-5 items-center">
                                                    <input id="deliverable_4" name="deliverables" type="checkbox" value="AP外部設計書"
                                                           class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-secondary focus:ring-secondary dark:bg-gray-700" checked>
                                                </div>
                                                <div class="ml-3 text-sm">
                                                    <label for="deliverable_4" class="font-medium text-gray-700 dark:text-gray-300">AP外部設計書</label>
                                                </div>
                                            </div>
                                        </div>
                                        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">※ 25種類の成果物から選択可能（スクロールして確認してください）</p>
                                    </div>

                                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                                        <div>
                                            <label for="desired_delivery_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                                希望納期
                                            </label>
                                            <div class="mt-1">
                                                <input type="date" id="desired_delivery_date" name="desired_delivery_date"
                                                       class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white">
                                            </div>
                                        </div>

                                        <div>
                                            <label for="estimate_copies" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                                見積書部数
                                            </label>
                                            <div class="mt-1">
                                                <input type="number" id="estimate_copies" name="estimate_copies" min="1" max="10"
                                                       class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                       placeholder="3">
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label for="delivery_location" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                            納入場所
                                        </label>
                                        <div class="mt-1">
                                            <input type="text" id="delivery_location" name="delivery_location"
                                                   class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                   placeholder="例：東京都港区...">
                                        </div>
                                    </div>

                                    <div>
                                        <label for="acceptance_conditions" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                            検収条件
                                        </label>
                                        <div class="mt-1">
                                            <textarea id="acceptance_conditions" name="acceptance_conditions" rows="3"
                                                      class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                      placeholder="検収条件を入力してください"></textarea>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                                        <div>
                                            <label for="supplied_items" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                                支給品
                                            </label>
                                            <div class="mt-1">
                                                <textarea id="supplied_items" name="supplied_items" rows="3"
                                                          class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                          placeholder="支給品がある場合は記載してください"></textarea>
                                            </div>
                                        </div>

                                        <div>
                                            <label for="loaned_items" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                                貸与品
                                            </label>
                                            <div class="mt-1">
                                                <textarea id="loaned_items" name="loaned_items" rows="3"
                                                          class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                          placeholder="貸与品がある場合は記載してください"></textarea>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label for="applicable_standards" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                            適用標準
                                        </label>
                                        <div class="mt-1">
                                            <textarea id="applicable_standards" name="applicable_standards" rows="3"
                                                      class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                      placeholder="適用する標準がある場合は記載してください"></textarea>
                                        </div>
                                    </div>

                                    <div>
                                        <label for="special_notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                            特記事項
                                        </label>
                                        <div class="mt-1">
                                            <textarea id="special_notes" name="special_notes" rows="4"
                                                      class="block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:text-white"
                                                      placeholder="特記事項がある場合は記載してください"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 text-right sm:px-6">
                                <div class="flex justify-end space-x-3">
                                    <button type="button" 
                                            class="inline-flex items-center rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                                        キャンセル
                                    </button>
                                    <button type="submit" 
                                            class="inline-flex items-center rounded-md border border-transparent bg-primary px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                                        <i class="fas fa-save mr-2"></i>
                                        保存
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const currentTheme = localStorage.getItem('theme') || 'light';
        html.classList.toggle('dark', currentTheme === 'dark');
        
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                const newTheme = html.classList.contains('dark') ? 'dark' : 'light';
                localStorage.setItem('theme', newTheme);
            });
        }
    </script>
</body>
</html>
